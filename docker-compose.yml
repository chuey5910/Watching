# ทางเลือก: รันใน Docker พร้อม Tailscale sidecar (เครื่องนี้จะปรากฏใน Tailnet เป็นโหนดชื่อ "jabta")
# ต้องมี TS_AUTHKEY จาก https://login.tailscale.com/admin/settings/keys
services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: jabta
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_EXTRA_ARGS=--advertise-tags=tag:jabta
    volumes:
      - ts-state:/var/lib/tailscale
      - ./scripts/ts-serve.json:/config/serve.json:ro
    devices: ["/dev/net/tun:/dev/net/tun"]
    cap_add: [NET_ADMIN, SYS_MODULE]
    restart: unless-stopped
  app:
    build: .
    network_mode: service:tailscale     # ใช้เครือข่ายเดียวกับ tailscale → เข้าถึงได้เฉพาะใน Tailnet
    env_file: .env
    environment:
      - BIND=127.0.0.1:8085
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on: [tailscale]
    restart: unless-stopped
volumes:
  ts-state:
